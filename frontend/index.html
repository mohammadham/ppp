<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f6f4ef">
  <title>دانلود آخرین نسخه پایان‌نامه</title>
  <style>
    :root { color-scheme: light; --paper:#f6f4ef; --ink:#173f3a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100svh; display:grid; place-items:center;
      background:radial-gradient(ellipse at 50% 45%,#fffefa 0%,var(--paper) 65%,#eeece5 100%);
      padding:24px; font-family:Tahoma,sans-serif; }
    a { display:inline-flex; justify-content:center; align-items:center; gap:14px;
      background:var(--ink); color:white; text-decoration:none; border:1px solid #24534c;
      padding:22px 30px; border-radius:14px; min-height:68px; max-width:100%;
      font-size:16px; line-height:1.8; text-align:center;
      box-shadow:0 8px 24px #173f3a18,0 1px 3px #173f3a20;
      transition:transform .18s ease,background-color .18s ease,box-shadow .18s ease;
      animation:arrive .5s ease both; }
    a:hover { background:#22534b; transform:translateY(-2px); box-shadow:0 12px 30px #173f3a22; }
    a:active { transform:translateY(0); }
    a:focus-visible { outline:3px solid #65897c; outline-offset:6px; }
    svg { width:23px; height:23px; flex-shrink:0; }
    @keyframes arrive { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @media(max-width:380px) { a { padding:19px 22px; font-size:14px; gap:10px; } }
    @media(prefers-reduced-motion:reduce) { a { animation:none; transition:none; } }
  </style>
</head>
<body>
  <a data-testid="download-thesis-button" href="__DOWNLOAD_URL__" download="thesis-latest.docx" aria-label="دانلود آخرین نسخه پایان‌نامه، فایل Word قابل‌ویرایش">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></svg>
    دانلود آخرین نسخه پایان‌نامه
  </a>
</body>
</html>
